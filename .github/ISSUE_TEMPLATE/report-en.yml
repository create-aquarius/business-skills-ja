name: Something did not work (English)
description: Report a skill that did not behave as expected
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        You do not need to know how skills work to file this.
        Fill in what you can — partial reports are welcome.

  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - meeting-notes-to-actions
        - content-repurposing
        - feedback-organizer
        - inquiry-reply-draft
        - service-description
        - competitor-research-notes
        - weekly-report
        - Not sure / other
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool are you using?
      options:
        - ChatGPT
        - Claude (browser)
        - Claude Code
        - Codex
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input you pasted (optional)
      description: Please remove any customer names or personal information first.
